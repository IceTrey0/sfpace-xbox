name: Build Xbox package
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download game files from the "game-assets" release
        shell: pwsh
        run: |
          gh release download game-assets --pattern "sfpa-ce.zip" --dir $env:RUNNER_TEMP
          $x = "$env:RUNNER_TEMP\game"
          Expand-Archive "$env:RUNNER_TEMP\sfpa-ce.zip" $x -Force
          $dst = "XboxFlash\www\game"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item "$x\FPA.swf","$x\gamepad.swf" $dst
          Copy-Item "$x\Levels" "$dst\Levels" -Recurse
          Get-ChildItem $dst -Recurse -Filter *.fla | Remove-Item -Force   # source files, not needed at runtime

      - name: Download latest Ruffle (self-hosted web build)
        shell: pwsh
        run: |
          $rel = gh api "repos/ruffle-rs/ruffle/releases?per_page=5" | ConvertFrom-Json
          $asset = $rel.assets | Where-Object { $_.name -like "*web-selfhosted.zip" } | Select-Object -First 1
          if (-not $asset) { throw "No selfhosted Ruffle asset found" }
          Write-Host "Using $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\ruffle.zip"
          Expand-Archive "$env:RUNNER_TEMP\ruffle.zip" "XboxFlash\www\ruffle" -Force

      - name: Create signing certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=XboxFlashDev" `
            -KeyUsage DigitalSignature -FriendlyName "XboxFlashDev" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3","2.5.29.19={text}")
          $pw = ConvertTo-SecureString "xboxdev" -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath XboxFlash\XboxFlash_TemporaryKey.pfx -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath XboxFlash\XboxFlashDev.cer | Out-Null

      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2

      - name: Restore + build
        shell: pwsh
        run: |
          $uap = "${env:ProgramFiles(x86)}\Windows Kits\10\Platforms\UAP"
          if (-not (Test-Path $uap)) {
            Write-Host "No UAP SDK folder. Installed platforms:"
            Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Platforms" -ErrorAction SilentlyContinue
            throw "UWP SDK missing on this runner"
          }
          $sdk = Get-ChildItem $uap | Sort-Object { [version]$_.Name } | Select-Object -Last 1
          Write-Host "Using UAP SDK $($sdk.Name)"
          nuget restore XboxFlash\XboxFlash.csproj -PackagesDirectory packages
          msbuild XboxFlash\XboxFlash.csproj /restore /p:Configuration=Release /p:Platform=x64 `
            /p:TargetPlatformVersion=$($sdk.Name) `
            /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\out\" `
            /p:PackageCertificateKeyFile="$env:GITHUB_WORKSPACE\XboxFlash\XboxFlash_TemporaryKey.pfx" `
            /p:PackageCertificatePassword=xboxdev /p:AppxPackageSigningEnabled=true

      - name: Collect output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem out -Recurse -Include *.appx,*.msix,*.cer | Copy-Item -Destination dist
          Copy-Item XboxFlash\XboxFlashDev.cer dist -ErrorAction SilentlyContinue
          Get-ChildItem out -Recurse -Filter Dependencies | Get-ChildItem -Recurse -Filter x64 | Get-ChildItem -Filter *.appx | Copy-Item -Destination dist -ErrorAction SilentlyContinue
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: xbox-package
          path: dist/*
